<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>נוכחות</title>
<meta name="theme-color" content="#3b5bdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="נוכחות">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #f3f4f9; --card: #ffffff; --ink: #14172b; --muted: #6a6f89; --line: #e6e8f1;
  --accent: #3b5bdb; --accent-ink: #ffffff; --accent-soft: #e8ecff;
  --money: #0b8f6a; --money-soft: #e0f6ee;
  --prem: #c26a00; --prem-soft: #fff1d9;
  --danger: #d9363e; --danger-soft: #fde8ea;
  --hero-a: #3b5bdb; --hero-b: #5f3dc4;
  --shadow: 0 1px 2px rgba(20,23,43,.06), 0 8px 24px rgba(20,23,43,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1020; --card: #181b30; --ink: #eceefb; --muted: #959ab8; --line: #2a2e4a;
    --accent: #7c93ff; --accent-ink: #0e1020; --accent-soft: #252a52;
    --money: #3ddba7; --money-soft: #12362d;
    --prem: #ffb54a; --prem-soft: #3a2b10;
    --danger: #ff6b73; --danger-soft: #3d1a1e;
    --hero-a: #2b3fa8; --hero-b: #4b2a9a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", "Heebo", "Arial Hebrew", Arial, sans-serif;
  padding: env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 520px; margin: 0 auto; padding: 14px 16px 0; display: grid; gap: 14px; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month { display: flex; align-items: center; gap: 4px; }
.month h1 { font-size: 20px; margin: 0; min-width: 130px; text-align: center; font-weight: 700; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
  display: grid; place-items: center; box-shadow: var(--shadow);
}
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:active { transform: scale(.95); }

/* hero / clock */
.hero {
  background: linear-gradient(145deg, var(--hero-a), var(--hero-b)); color: #fff;
  border-radius: 24px; padding: 20px 20px 16px; box-shadow: var(--shadow); text-align: center;
}
.hero-top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; opacity: .95; min-height: 26px; }
.status { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 99px; background: rgba(255,255,255,.16); font-weight: 600; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #c9cdf5; }
.status.on::before { background: #5df2b8; box-shadow: 0 0 0 0 rgba(93,242,184,.7); animation: pulse 1.8s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(93,242,184,0); } 100% { box-shadow: 0 0 0 0 rgba(93,242,184,0); } }
.timer { font-size: 54px; font-weight: 700; letter-spacing: .5px; margin: 10px 0 2px; line-height: 1.1; }
.live { font-size: 15px; opacity: .92; min-height: 22px; }
.punch {
  width: 100%; margin-top: 14px; border: 0; border-radius: 18px; padding: 16px; font-size: 20px; font-weight: 700;
  background: #fff; color: #2b3a9e; box-shadow: 0 6px 18px rgba(0,0,0,.18); transition: transform .08s;
}
.punch.out { background: #ffe3e5; color: #b4232b; }
.punch:active { transform: scale(.98); }
.hero-links { display: flex; justify-content: center; gap: 18px; margin-top: 12px; flex-wrap: wrap; }
.link { background: none; border: 0; color: #fff; opacity: .9; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; padding: 4px; }
.warn { margin-top: 10px; background: rgba(255,200,120,.22); border-radius: 12px; padding: 8px 12px; font-size: 14px; }

/* cards */
.card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.summary { padding: 16px; }
.big-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.big { padding: 12px 14px; border-radius: 16px; background: var(--accent-soft); }
.big.net { background: var(--money-soft); }
.lbl { font-size: 13px; color: var(--muted); }
.big .num { font-size: 26px; font-weight: 700; margin-top: 2px; }
.big.net .num { color: var(--money); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.chip b { color: var(--ink); font-weight: 600; }
.chip.prem b { color: var(--prem); }
details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
summary { cursor: pointer; font-size: 14px; color: var(--accent); padding: 4px 0; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::after { content: " ▾"; }
details[open] summary::after { content: " ▴"; }
.breakdown { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 4px; }
.breakdown td { padding: 6px 0; }
.breakdown td:last-child { text-align: left; }
.breakdown tr.sub td { color: var(--muted); }
.breakdown tr.tot td { border-top: 1px solid var(--line); font-weight: 700; padding-top: 8px; }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

/* list */
.list-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 0; }
.list-head h2 { font-size: 16px; margin: 0; color: var(--muted); font-weight: 600; }
.shift {
  display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: right;
  padding: 12px 14px; border: 0; background: none; border-bottom: 1px solid var(--line);
}
.shift:last-child { border-bottom: 0; }
.shift:active { background: var(--bg); }
.date-chip { text-align: center; background: var(--bg); border-radius: 12px; padding: 6px 0; line-height: 1.15; border: 1px solid var(--line); }
.date-chip b { display: block; font-size: 20px; }
.date-chip span { font-size: 12px; color: var(--muted); }
.shift .times { font-weight: 600; }
.shift .meta { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--prem-soft); color: var(--prem); }
.badge.live { background: var(--money-soft); color: var(--money); }
.shift .pay { font-weight: 700; font-size: 17px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* dialogs */
dialog {
  border: 0; border-radius: 24px; padding: 0; width: min(520px, calc(100vw - 24px)); max-height: calc(100dvh - 32px);
  background: var(--card); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.35);
}
dialog::backdrop { background: rgba(10,12,30,.55); backdrop-filter: blur(3px); }
.dlg { padding: 20px; display: grid; gap: 14px; }
.dlg h3 { margin: 0; font-size: 19px; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; color: var(--muted); }
input, select {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
  padding: 11px 12px; width: 100%; min-height: 46px;
}
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quick { padding: 14px 16px 16px; display: grid; gap: 12px; }
.quick-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.quick-head h2 { font-size: 16px; margin: 0; font-weight: 700; }
.quick-date { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.quick-date input { width: auto; min-height: 38px; padding: 6px 10px; font-size: 14px; }
.toast.has-btn { pointer-events: auto; }
.toast-btn { margin-inline-start: 10px; border: 0; border-radius: 10px; padding: 4px 12px; font-weight: 700; background: #fff; color: #2b3a9e; }
.presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.preset {
  display: grid; gap: 2px; justify-items: center; padding: 10px 4px; border-radius: 14px;
  border: 1.5px solid var(--line); background: var(--bg);
}
.preset b { font-size: 16px; }
.preset span { font-size: 12px; color: var(--muted); }
.preset.on { border-color: var(--accent); background: var(--accent-soft); }
.preset:active { transform: scale(.97); }
.preview { background: var(--accent-soft); border-radius: 14px; padding: 10px 14px; font-size: 14px; min-height: 42px; }
.preview.err { background: var(--danger-soft); color: var(--danger); }
.actions { display: flex; gap: 10px; }
.btn { flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 13px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: var(--danger); background: var(--danger-soft); border-color: transparent; flex: 0 0 auto; padding: 13px 18px; }
.sect { font-size: 13px; color: var(--muted); font-weight: 700; margin: 6px 0 -4px; letter-spacing: .3px; }
.hol { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.hol input { width: 22px; min-height: 22px; height: 22px; flex: none; accent-color: var(--accent); }
.hol .nm { flex: 1; } .hol .dt { color: var(--muted); font-size: 13px; }
.hol .x { border: 0; background: none; color: var(--danger); font-size: 20px; padding: 0 6px; }
.add-hol { display: flex; gap: 8px; margin-top: 8px; }
.add-hol input { flex: 1; } .add-hol .btn { flex: 0 0 auto; padding: 0 16px; }

.toast {
  position: fixed; inset-inline: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); margin: auto; max-width: 420px;
  background: #1c2040; color: #fff; padding: 12px 16px; border-radius: 14px; text-align: center; font-size: 15px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35); opacity: 0; transform: translateY(12px); pointer-events: none; transition: .25s; z-index: 50;
}
.toast.show { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<dialog id="shift-dlg"><div class="dlg" id="shift-body"></div></dialog>
<dialog id="settings-dlg"><div class="dlg" id="settings-body"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
